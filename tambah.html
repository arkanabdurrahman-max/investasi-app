<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Aset Investasi</title>
    <link href="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="form-container">
        <h2>Tambah Investasi Baru</h2>
        <form id="tambahForm" action="index.html" method="GET">
            <div class="form-group">
                <label for="namaBarang">Nama Barang</label>
                <input type="text" id="namaBarang" placeholder="Contoh: Jam Tangan Rolex Submariner" required>
            </div>
            <div class="form-group">
                <label for="kategori">Kategori</label>
                <input type="text" id="kategori" placeholder="Contoh: Jam Tangan / Emas / Koleksi" required>
            </div>
            <div class="form-group">
                <label for="hargaBeli">Harga Beli (Rp)</label>
                <input type="number" id="hargaBeli" placeholder="Masukkan harga beli" required>
            </div>
            <div class="form-group">
                <label for="hargaSekarang">Harga Pasar Saat Ini (Rp)</label>
                <input type="number" id="hargaSekarang" placeholder="Masukkan harga pasar sekarang" required>
            </div>
            <button type="submit" class="btn">Simpan Aset</button>
            <a href="index.html" class="btn btn-secondary">Kembali</a>
        </form>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
